<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة المنهاج من ميراث النبوة</title>
    <style>
        :root {
            --primary-color: #2c5e50;
            --secondary-color: #e8f5e9;
            --accent-color: #81c784;
            --text-color: #333;
            --bg-color: #f4f7f6;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            text-align: center;
            margin-bottom: 25px;
        }
        h1 {
            color: var(--primary-color);
            margin-bottom: 5px;
        }
        p.subtitle {
            color: #666;
            font-size: 1.1rem;
        }
        .container {
            width: 100%;
            max-width: 700px;
        }
        
        /* واجهة الأقسام الرئيسية */
        .home-view {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
        }
        .section-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border-right: 6px solid var(--primary-color);
        }
        .section-title {
            font-size: 1.2rem;
            color: var(--primary-color);
            font-weight: bold;
            margin-bottom: 15px;
        }
        .menu-btn {
            background: var(--secondary-color);
            border: 2px solid var(--primary-color);
            color: var(--primary-color);
            padding: 15px 20px;
            border-radius: 10px;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            text-align: right;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .menu-btn:hover {
            background-color: var(--primary-color);
            color: white;
        }

        /* واجهة عرض البطاقات التفاعلية (Flashcards) */
        .quiz-view {
            display: none;
            width: 100%;
        }
        .card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            padding: 30px;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
            text-align: center;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 8px;
            height: 100%;
            background-color: var(--primary-color);
        }
        .card-category {
            font-size: 0.85rem;
            color: var(--primary-color);
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 15px;
            display: inline-block;
            background: var(--secondary-color);
            padding: 4px 12px;
            border-radius: 20px;
        }
        .card-question {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 25px;
            color: #2c3e50;
            line-height: 1.6;
        }
        .answer-section {
            display: none;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px dashed #e0e0e0;
            background-color: #fafbfc;
            padding: 15px;
            border-radius: 8px;
            color: #27ae60;
            font-weight: 500;
            line-height: 1.6;
            text-align: right;
        }
        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #1e3f35;
        }
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        .nav-btn {
            background-color: #e0e0e0;
            color: #333;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: background 0.2s;
        }
        .nav-btn:hover:not(:disabled) {
            background-color: #d0d0d0;
        }
        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .back-home-btn {
            background-color: #7f8c8d;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            margin-bottom: 15px;
            transition: background 0.2s;
        }
        .back-home-btn:hover {
            background-color: #616a6b;
        }
        .counter {
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
            color: #666;
        }
    </style>
</head>
<body>

    <header>
        <h1>🌿 المنهاج من ميراث النبوة</h1>
        <p class="subtitle">منصة مراجعة وتثبيت أبواب كتاب المنهاج بنظام الـ Flashcards التفاعلية</p>
    </header>

    <div class="container">
        <!-- واجهة الأقسام الرئيسية -->
        <div class="home-view" id="home-view">
            
            <!-- قسم الاختبار الشمولي -->
            <div class="section-card">
                <div class="section-title">⚡ الاختبار الشمولي للكتاب</div>
                <button class="menu-btn" onclick="startQuiz('all')">
                    <span>بدء الاختبار الشمولي (الباب الأول والباب الثاني معاً)</span>
                    <span>←</span>
                </button>
            </div>

            <!-- قسم أبواب المنهاج -->
            <div class="section-card">
                <div class="section-title">📖 تصفح أبواب المنهاج</div>
                <button class="menu-btn" onclick="startQuiz(1)">
                    <span>الباب الأول: مرجعية الوحي وشموليته ومركزية التسليم لله ولرسوله ﷺ</span>
                    <span>←</span>
                </button>
                <button class="menu-btn" onclick="startQuiz(2)">
                    <span>الباب الثاني: تلقي القرآن على منهاج النبوة وتقديم مقصد العمل به</span>
                    <span>←</span>
                </button>
            </div>

        </div>

        <!-- واجهة عرض البطاقات التفاعلية (Flashcards) -->
        <div class="quiz-view" id="quiz-view">
            <button class="back-home-btn" onclick="goHome()">← العودة للرئيسية</button>
            
            <div class="card" id="card-box">
                <!-- المحتوى يتغير برمجياً -->
            </div>

            <div class="nav-buttons">
                <button class="nav-btn" id="prev-btn" onclick="prevCard()">← السابق</button>
                <button class="nav-btn" id="next-btn" onclick="nextCard()">التالي →</button>
            </div>
            <div class="counter" id="counter-box"></div>
        </div>
    </div>

                question: "ما هو النص الذي يختتم به الباب الثاني بالكامل (وهو النص رقم 14)؟",
                answer: "أثر حذيفة بن اليمان رضي الله عنه الطويل في حديث الأمانة ونزلها في جذر قلوب الرجال ثم رفعها."

        let activeData = [];
        let currentIndex = 0;

        function startQuiz(type) {
            if (type === 'all') {
                activeData = [...chapter1Data, ...chapter2Data];
            } else if (type === 1) {
                activeData = [...chapter1Data];
            } else if (type === 2) {
                activeData = [...chapter2Data];
            }
            
            currentIndex = 0;
            document.getElementById('home-view').style.display = 'none';
            document.getElementById('quiz-view').style.display = 'block';
            renderCard();
        }

        function goHome() {
            document.getElementById('quiz-view').style.display = 'none';
            document.getElementById('home-view').style.display = 'flex';
        }

        function renderCard() {
            const cardBox = document.getElementById('card-box');
            const item = activeData[currentIndex];
            
            cardBox.innerHTML = `
                <span class="card-category">${item.category}</span>
                <div class="card-question">${currentIndex + 1}. ${item.question}</div>
                <button class="btn" id="ans-btn" onclick="toggleAnswer()">إظهار الإجابة</button>
                <div class="answer-section" id="answer-sec">${item.answer}</div>
            `;

            document.getElementById('prev-btn').disabled = currentIndex === 0;
            document.getElementById('next-btn').disabled = currentIndex === activeData.length - 1;
            document.getElementById('counter-box').textContent = `السؤال ${currentIndex + 1} من ${activeData.length}`;
        }

        function toggleAnswer() {
            const ansSec = document.getElementById('answer-sec');
            const ansBtn = document.getElementById('ans-btn');
            if (ansSec.style.display === 'block') {
                ansSec.style.display = 'none';
                ansBtn.textContent = 'إظهار الإجابة';
            } else {
                ansSec.style.display = 'block';
                ansBtn.textContent = 'إخفاء الإجابة';
            }
        }

        function nextCard() {
            if (currentIndex < activeData.length - 1) {
                currentIndex++;
                renderCard();
            }
        }

        function prevCard() {
            if (currentIndex > 0) {
                currentIndex--;
                renderCard();
            }
        }
    </script>
</body>
</html>
