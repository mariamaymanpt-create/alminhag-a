<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البطاقات التعليمية - المنهاج من ميراث النبوة</title>
    <style>
        :root {
            --primary-color: #2c5e50;
            --secondary-color: #e8f5e9;
            --accent-color: #81c784;
            --text-color: #333;
            --bg-color: #f4f7f6;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            text-align: center;
            margin-bottom: 25px;
        }
        h1 {
            color: var(--primary-color);
            margin-bottom: 5px;
        }
        p.subtitle {
            color: #666;
            font-size: 1.1rem;
        }
        .container {
            width: 100%;
            max-width: 700px;
        }
        .card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            padding: 30px;
            margin-bottom: 20px;
            transition: transform 0.2s ease;
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 8px;
            height: 100%;
            background-color: var(--primary-color);
        }
        .card-category {
            font-size: 0.85rem;
            color: var(--primary-color);
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 10px;
            display: inline-block;
            background: var(--secondary-color);
            padding: 4px 10px;
            border-radius: 20px;
        }
        .card-question {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: #2c3e50;
        }
        .answer-section {
            display: none;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px dashed #e0e0e0;
            background-color: #fafbfc;
            padding: 15px;
            border-radius: 8px;
            color: #27ae60;
            font-weight: 500;
            line-height: 1.6;
        }
        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #1e3f35;
        }
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>المنهاج من ميراث النبوة</h1>
        <p class="subtitle">بنك الأسئلة والمراجعة - الباب الثاني</p>
    </header>

    <div class="container" id="card-container">
        <!-- سيتم تعبئة البطاقات ديناميكياً أو عرضها تباعاً -->
    </div>

    <script>
        const questionsData = [
            {
                category: "اسم الباب",
                question: "ما هو العنوان الكامل والدقيق للباب الثاني من كتاب 'المنهاج من ميراث النبوة'؟",
                answer: "باب في تلقي القرآن على منهاج النبوة، وتقديم مقصد العمل به وتدبره والاستهداء والاستغناء به وتحكيمه وزيادة الإيمان به على غير ذلك من المقاصد الشريفة[cite: 2]."
            },
            {
                category: "إكمال المتون",
                question: "أتمم أثر عبد الله بن عمر رضي الله عنهما بنصه إلى آخره: «لَقَدْ عِشْنَا بُرْهَةً مِنْ دَهْرِنَا وَأَحَدُنَا يُؤْتَى الْإِيمَانَ قَبْلَ الْقُرْآنِ...»؟",
                answer: "«...وَتَنْزِلُ السُّورَةُ عَلَى مُحَمَّدٍ ﷺ فَتَتَعَلَّمُ حَلَالَهَا وَحَرَامَهَا وَآمِرَهَا وَزَاجِرَهَا وَمَا يَنْبَغِي أَنْ يَقِفَ عِنْدَهُ مِنْهَا كَمَا تَعَلَّمُونَ أَنْتُمُ الْيَوْمَ الْقُرْآنَ. ثُمَّ لَقَدْ رَأَيْتُ الْيَوْمَ رِجَالًا يُؤْتَى أَحَدُهُمُ الْقُرْآنَ قَبْلَ الْإِيمَانِ، فَيَقْرَأُ مَا بَيْنَ فَاتِحَتِهِ إِلَى خَاتِمَتِهِ مَا يَدْرِي مَا آمِرُهُ وَلَا زَاجِرُهُ وَلَا مَا يَنْبَغِي أَنْ يَقِفَ عِنْدَهُ مِنْهُ، فَيَنْثُرَهُ نَثْرَ الدَّقَلِ»[cite: 2]."
            },
            {
                category: "إكمال المتون",
                question: "أتمم حديث أبي هريرة رضي الله عنه في فضل مجالس القرآن إلى نهايته: «مَا اجْتَمَعَ قَوْمٌ فِي بَيْتٍ مِنْ بُيُوتِ اللَّهِ يَتْلُونَ كِتَابَ اللَّهِ وَيَتَدَارَسُونَهُ بَيْنَهُمْ...»؟",
                answer: "«...إِلَّا نَزَلَتْ عَلَيْهِمُ السَّكِينَةُ وَغَشِيَتْهُمُ الرَّحْمَةُ وَحَفَّتْهُمُ الْمَلَائِكَةُ وَذَكَرَهُمُ اللَّهُ فِيمَنْ عِنْدَهُ»[cite: 2]."
            },
            {
                category: "إكمال المتون",
                question: "أتمم الجزء الثاني (حديث رفع الأمانة) من أثر حذيفة بن اليمان رضي الله عنه: «يَنَامُ الرَّجُلُ النَّوْمَةَ فَتُقْبَضُ الْأَمَانَةُ مِنْ قَلْبِهِ فَيَظَلُّ أَثَرُهَا...» إلى وصف الجمرة؟",
                answer: "«...مِثْلَ الْوَكْتِ، ثُمَّ يَنَامُ النَّوْمَةَ فَتُقْبَضُ الْأَمَانَةُ مِنْ قَلْبِهِ فَيَظَلُّ أَثَرُهَا مِثْلَ الْمَجْلِ، كَجَمْرٍ دَحْرَجْتَهُ عَلَى رِجْلِكَ فَنَفِطَ فَتَرَاهُ مُنْتَبِرًا وَلَيْسَ فِيهِ شَيْءٌ - ثُمَّ أَخَذَ حَصًى فَدَحْرَجَهُ عَلَى رِجْلِهِ، فَيُصْبِحُ النَّاسُ يَتَبَايَعُونَ لَا يَكَادُ أَحَدٌ يُؤَدِّي الْأَمَانَةَ، حَتَّى يُقَالَ: إِنَّ فِي بَنِي فُلَانٍ رَجُلًا أَمِينًا، حَتَّى يُقَالَ لِلرَّجُلِ: مَا أَجْلَدَهُ مَا أَظْرَفَهُ! مَا أَعْقَلَهُ! وَمَا فِي قَلْبِهِ مِثْقَالُ حَبَّةٍ مِنْ خَرْدَلٍ مِنْ إِيمَانٍ»[cite: 2]."
            },
            {
                category: "إكمال المتون",
                question: "أتمم أثر عبد الله بن مسعود رضي الله عنه: «كَانَ الرَّجُلُ مِنَّا إِذَا تَعَلَّمَ عَشْرَ آيَاتٍ...» إلى نهايته[cite: 2].",
                answer: "«...لَمْ يُجَاوِزُهُنَّ حَتَّى يَعْرِفَ مَعَانِيَهُنَّ وَالْعَمَلَ بِهِنَّ»[cite: 2]."
            },
            {
                category: "إكمال المتون",
                question: "أتمم أثر أنس بن مالك رضي الله عنه في الكاتب بين يدي النبي ﷺ: «كَانَ رَجُلٌ يَكْتُبُ بَيْنَ يَدَيْ رَسُولِ اللَّهِ ﷺ قَدْ قَرَأَ الْبَقَرَةَ وَآلَ عِمْرَانَ...» إلى نهايته[cite: 2].",
                answer: "«...وَكَانَ الرَّجُلُ إِذَا قَرَأَ الْبَقَرَةَ وَآلَ عِمْرَانَ يُعَدُّ فِينَا عَظِيمًا»[cite: 2]."
            },
            {
                category: "الرواة",
                question: "من هو الصحابي الجليل الذي قال: «كُنَّا مَعَ النَّبِيِّ ﷺ وَنَحْنُ فِتْيَانُ حَزَاوِرَةٌ، فَتَعَلَّمْنَا الْإِيمَانَ قَبْلَ أَنْ نَتَعَلَّمَ الْقُرْآنَ»؟",
                answer: "جندب بن عبد الله رضي الله عنه[cite: 2]."
            },
            {
                category: "الرواة",
                question: "من هو التابعي الجليل الذي روى منهج الصحابة في أخذ القرآن عشر آيات عشر آيات عن أصحاب النبي ﷺ؟",
                answer: "أبو عبد الرحمن السلمي رحمه الله[cite: 2]."
            },
            {
                category: "التخريج",
                question: "أثر ابن عمر رضي الله عنهما في تعلم الإيمان قبل القرآن ونثر القرآن نثر الدقل، مَن أخرجه وما هو اللفظ المُعتمد؟",
                answer: "أخرجه الحاكم (١٠١)، والبيهقي (٥٣٥٥)، واللفظ للبيهقي[cite: 2]."
            },
            {
                category: "التخريج",
                question: "قصة استشهاد القراء السبعين وبئر معونة (حديث أنس بن مالك رضي الله عنه)، في أي الصحيحين أو السنن أُخرج؟",
                answer: "أخرجه مسلم (٦٧٧)[cite: 2]."
            },
            {
                category: "التخريج",
                question: "أثر عبد الله بن مسعود رضي الله عنه في توقف الرجل عند عشر آيات لا يجاوزهن حتى يعلمهن، مَن أخرجه؟",
                answer: "أخرجه الحاكم (٢٠٦٦)، والبيهقي في الكبرى (٥٣٥٣)، والطبري في تفسيره (واللفظ للطبري)[cite: 2]."
            },
            {
                category: "التخريج",
                question: "كم مكث عبد الله بن عمر رضي الله عنهما يتعلم سورة البقرة، ومَن أخرج هذا الأثر؟",
                answer: "مكث فيها ثماني سنين يتعلمها، وأخرجه مالك (٥٤٦)[cite: 2]."
            },
            {
                category: "التخريج",
                question: "أثر أنس بن مالك رضي الله عنه في كون من قرأ البقرة وآل عمران يُعد فيهم عظيماً، في أي الكتب أُخرج؟",
                answer: "أخرجه أحمد (١٢٢١٦)[cite: 2]."
            },
            {
                category: "ترتيب النصوص",
                question: "ما هو النص أو الأثر الذي يأتي مباشرة بعد أثر عبد الله بن عمر (لَقَدْ عِشْنَا بُرْهَةً...) في الباب الثاني؟",
                answer: "أثر جندب بن عبد الله رضي الله عنه: «كُنَّا مَعَ النَّبِيِّ ﷺ وَنَحْنُ فِتْيَانُ حَزَاوِرَةٌ...»[cite: 2]."
            },
            {
                category: "ترتيب النصوص",
                question: "ما هو الحديث الذي يسبق مباشرة أثر أبي عبد الرحمن السلمي (حَدَّثَنَا مَنْ كَانَ يُقْرِئُنَا...) في ترتيب الباب؟",
                answer: "حديث أنس بن مالك رضي الله عنه في قصة بعث القراء السبعين من الأنصار[cite: 2]."
            },
            {
                category: "ترتيب النصوص",
                question: "ما هو الأثر الذي يأتي مباشرة قبل أثر حذيفة بن اليمان (حَدَّثَنَا رَسُولُ اللَّهِ ﷺ حَدِيثَيْنِ) في ختام الباب الثاني؟",
                answer: "أثر أنس رضي الله عنه في الرجل الذي كان يكتب بين يدي النبي ﷺ وقد قرأ البقرة وآل عمران[cite: 2]."
            },
            {
                category: "ترتيب النصوص",
                question: "ما هو النص الذي يختتم به الباب الثاني بالكامل (وهو النص رقم 14)؟",
                answer: "أثر حذيفة بن اليمان رضي الله عنه الطويل في حديث الأمانة ونزلها في جذر قلوب الرجال ثم رفعها[cite: 2]."
            }
        ];

        const container = document.getElementById('card-container');

        questionsData.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <span class="card-category">${item.category}</span>
                <div class="card-question">${index + 1}. ${item.question}</div>
                <button class="btn" onclick="toggleAnswer(${index})">إظهار الإجابة</button>
                <div class="answer-section" id="answer-${index}">${item.answer}</div>
            `;
            container.appendChild(card);
        });

        function toggleAnswer(index) {
            const answerDiv = document.getElementById(`answer-${index}`);
            const btn = answerDiv.previousElementSibling;
            if (answerDiv.style.display === 'block') {
                answerDiv.style.display = 'none';
                btn.textContent = 'إظهار الإجابة';
            } else {
                answerDiv.style.display = 'block';
                btn.textContent = 'إخفاء الإجابة';
            }
        }
    </script>
</body>
</html>
