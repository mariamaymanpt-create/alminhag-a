<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المنهاج من ميراث النبوة</title>
    <!-- استيراد الخطوط والتصميم -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        header {
            background-color: #1b4d3e;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 {
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .nav-btn {
            background-color: #2e7d63;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }
        .nav-btn:hover {
            background-color: #24634f;
        }
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 600px;
            width: 100%;
        }
        .card h2 {
            color: #1b4d3e;
            font-size: 1.8rem;
            margin-bottom: 15px;
        }
        .card p {
            color: #666;
            font-size: 1rem;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .main-btn {
            background-color: #1b4d3e;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .main-btn.secondary {
            background-color: #e67e22;
        }
        .main-btn:hover {
            opacity: 0.9;
        }

        /* نافذة الفلاش كاردز التفاعلية */
        .flashcard-container {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 650px;
        }
        .chapter-select {
            margin-bottom: 20px;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 1rem;
            width: 100%;
            font-family: 'Cairo', sans-serif;
        }
        .flash-card {
            background: white;
            width: 100%;
            min-height: 250px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s;
            border-top: 5px solid #1b4d3e;
        }
        .flash-card:hover {
            transform: translateY(-3px);
        }
        .card-question {
            font-size: 1.2rem;
            color: #1b4d3e;
            font-weight: 700;
            margin-bottom: 20px;
        }
        .card-answer {
            font-size: 1.1rem;
            color: #444;
            line-height: 1.7;
            padding-top: 15px;
            border-top: 1px dashed #eee;
            display: none;
        }
        .card-answer.show {
            display: block;
        }
        .card-hint {
            font-size: 0.85rem;
            color: #888;
            margin-top: 15px;
        }
        .flashcard-controls {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: 20px;
            gap: 15px;
        }
        .ctrl-btn {
            background-color: #2e7d63;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            flex: 1;
        }
        .ctrl-btn:hover {
            background-color: #24634f;
        }
        .back-home {
            background-color: #7f8c8d;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <header>
        <h1>🌿 المنهاج من ميراث النبوة</h1>
        <button class="nav-btn" onclick="showHome()">منصة الحفظ والمراجعة</button>
    </header>

    <main>
        <!-- الواجهة الرئيسية -->
        <div class="card" id="home-card">
            <h2>مرحباً بكِ في مراجعة كتاب المنهاج من ميراث النبوة</h2>
            <p>منصتك التفاعلية الشاملة لحفظ المتون، مراجعة الأبواب، الرواة، التخريج، وإتمام الأحاديث بدقة وعناية.</p>
            
            <div class="btn-group">
                <button class="main-btn" onclick="startFlashcards()">📚 أبواب المنهاج (فلاش كاردز)</button>
                <button class="main-btn secondary">⚡ اختبارات شاملة</button>
            </div>
        </div>

        <!-- قسم الفلاش كاردز التفاعلي -->
        <div class="flashcard-container" id="flashcard-section">
            <select class="chapter-select" id="chapterSelect" onchange="changeChapter()">
                <option value="1">📚 الباب الأول: مرجعية الوحي وشموليته والتسليم لله ورسوله</option>
                <option value="2">📖 الباب الثاني: تلقي القرآن على منهاج النبوة ومقاصده</option>
                <option value="3">📖 الباب الثالث: تعظيم سنة النبي ﷺ ووجوب اتباعه</option>
                <option value="4">📖 الباب الرابع: تعظيم حدود الله والتحذير من مخالفته</option>
            </select>

            <div class="flash-card" onclick="toggleAnswer()">
                <div>
                    <div style="font-size: 0.9rem; color: #888; margin-bottom: 10px;" id="card-counter">السؤال 1 من أصل قيد التحميل</div>
                    <div class="card-question" id="questionText">جاري تحميل السؤال...</div>
                </div>
                <div>
                    <div class="card-answer" id="answerText">جاري تحميل الجواب...</div>
                    <div class="card-hint" id="hintText">💡 اضغط على البطاقة لإظهار أو إخفاء الإجابة</div>
                </div>
            </div>

            <div class="flashcard-controls">
                <button class="ctrl-btn" onclick="prevCard()">⬅️ السابقة</button>
                <button class="ctrl-btn" onclick="nextCard()">التالية ➡️</button>
            </div>
            <button class="ctrl-btn back-home" onclick="showHome()">العودة للرئيسية</button>
        </div>
    </main>

    <script>
        // قاعدة بيانات الأبواب الأربعة كاملة
        const chaptersData = {
            1: [
                { q: "ما هو العنوان الحرفي الدقيق للباب الأول؟", a: "بَابٌ فِي مَرْجِعِيَّةِ الْوَحْيِ وَشُمُولِيَّتِهِ وَمَرْكَزِيَّةِ التَّسْلِيمِ لِلهِ وَلِرَسُولِهِ ﷺ" },
                { q: "ما الآية الكريمة من سورة النساء التي تُعد أصلاً في وجوب رد النزاع إلى الله والرسول؟", a: "قوله تعالى: ﴿فَإِن تَنَزَعْتُمْ فِي شَيْءٍ فَرُدُّوهُ إِلَى اللَّهِ وَالرَّسُولِ﴾ [النساء: ٥٩]" },
                { q: "اذكر الآية التي نصت صراحة على نفي الإيمان حتى يتحقق التحكيم والرضا والتسليم لنبي الله ﷺ.", a: "قوله تعالى: ﴿فَلَا وَرَبِّكَ لَا يُؤْمِنُونَ حَتَّى يُحَكِّمُوكَ فِيمَا شَجَرَ بَيْنَهُمْ ثُمَّ لَا يَجِدُوا فِي أَنفُسِهِمْ حَرَجًا مِّمَّا قَضَيْتَ وَيُسَلِّمُوا تَسْلِيمًا﴾ [النساء: ٦٥]" },
                { q: "ما الآية التي نفت الخيرة للمؤمن والمؤمنة إذا قضى الله ورسوله أمراً؟", a: "قوله تعالى: ﴿وَمَا كَانَ لِمُؤْمِنٍ وَلَا مُؤْمِنَةٍ إِذَا قَضَى اللَّهُ وَرَسُولُهُ أَمْرًا أَن يَكُونَ لَهُمُ الْخِيَرَةُ مِنْ أَمْرِهِمْ﴾ [الأحزاب: ٣٦]" },
                { q: "ما الآية التي نصت على أن القرآن كتاب عزيز لا يأتيه الباطل من بين يديه ولا من خلفه؟", a: "قوله تعالى: ﴿وَإِنَّهُ لَكِتَابٌ عَزِيزٌ ەۙ لَّا يَأْتِيهِ الْبَاطِلُ مِنْ بَيْنِ يَدَيْهِ وَلَا مِنْ خَلْفِهِ﴾ [فصلت: ٤١-٤٢]" },
                { q: "في حديث زيد بن أرقم رضي الله عنه، ماذا قال النبي ﷺ عن القرآن الكريم؟", a: "قال: «كِتَابُ اللَّهِ، هُوَ حَبْلُ اللَّهِ، مَنِ اتَّبَعَهُ كَانَ عَلَى الْهُدَى، وَمَنْ تَرَكَهُ كَانَ عَلَى ضَلَالَةٍ» (أخرجه مسلم ٢٤٠٨)" },
                { q: "من راوي حديث: «لَا أُلْفِيَنَّ أَحَدَكُمْ مُتَّكِئًا عَلَى أَرِيكَتِهِ يَأْتِيهِ أَمْرٌ مِمَّا أَمَرْتُ بِهِ أوْ نَهَيْتُ عَنْهُ...» وما تخريجه؟", a: "الراوي: أبو رافع رضي الله عنه. أخرجه أبو داود (٤٦٠٥)، والترمذي (٢٦٦٣)" },
                { q: "ما لفظ حديث أبي هريرة رضي الله عنه المختصر في طاعة النبي ﷺ والعصيان؟ وما تخريجه؟", a: "قال النبي ﷺ: «مَنْ أَطَاعَنِي فَقَدْ أَطَاعَ اللَّهَ، وَمَنْ عَصَانِي فَقَدْ عَصَى اللَّهَ». أخرجه البخاري (٧١٣٧)، ومسلم (١٨٣٥)" },
                { q: "ما هي خطبة النبي ﷺ الدورية التي أوردها جابر بن عبد الله رضي الله عنهما؟", a: "كان يقول في الخطبة: «أَمَّا بَعْدُ: فَإِنَّ خَيْرَ الْحَدِيثِ كِتَابُ اللَّهِ وَخَيْرَ الْهَدْيِ هَدْيُ مُحَمَّدٍ، وَشَرُّ الْأُمُورِ مُحْدَثَاتُهَا، وَكُلُّ بِدْعَةٍ ضَلَالَةٌ» (أخرجه مسلم ٨٦٧)" },
                { q: "في حديث أبي هريرة الطويل عند نزول آية (وإن تبدوا ما في أنفسكم...)، ما البديل النبوي وما الآية الناسخة؟", a: "أمرهم أن يقولوا: «سَمِعْنَا وَأَطَعْنَا غُفْرَانَكَ رَبَّنَا وَإِلَيْكَ الْمَصِيرُ»، ونسختها قوله تعالى: ﴿لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا...﴾ (أخرجه مسلم ١٢٥)" }
            ],
            2: [
                { q: "ما هو العنوان الكامل للباب الثاني؟", a: "بَابٌ فِي تَلَقِي الْقُرْآنِ عَلَى مِنْهَاجِ النُّبُوَّةِ، وَتَقْدِيمِ مَقْصَدِ الْعَمَلِ بِهِ وَتَدَبَّرِهِ..." },
                { q: "في كم موضع ذكر الله تعالى تيسير القرآن للذكر في سورة القمر؟", a: "ذكرت في أربعة مواضع: ﴿وَلَقَدْ يَسَّرْنَا الْقُرْءَانَ لِلذِّكْرِ فَهَلْ مِن مُّدَّكِرٍ﴾ [القمر: ١٧-٢٢-٣٢-٤٠]" },
                { q: "ما معنى 'لِلذِّكْرِ' في سورة القمر حسب تفسير الإمام الطبري؟", a: "قال الطبري: «للذكر: لمن أراد أن يتذكر ويعتبر ويتعظ»." },
                { q: "ما الآية التي بينت أثر سماع القرآن على جلود القلوب خشوعاً ولينًا من سورة الزمر؟", a: "قوله تعالى: ﴿اللَّهُ نَزَّلَ أَحْسَنَ الْحَدِيثِ كِتَابًا مُّتَشَابِهَا مَّثَانِيَ تَقْشَعِرُّ مِنْهُ جُلُودُ الَّذِينَ يَخْشَوْنَ رَبَّهُمْ ثُمَّ تَلِينُ جُلُودُهُمْ وَقُلُوبُهُمْ إِلَى ذِكْرِ اللَّهِ...﴾" },
                { q: "ماذا قال عبد الله بن عمر رضي الله عنهما في مقارنة جيل الصحابة بالجيل الذي يليه؟", a: "قال: «لقد عشنا برهة من دهرنا وأحدنا يؤتى الإيمان قبل القرآن... ثم لقد رأيت اليوم رجالاً يؤتى أحدهم القرآن قبل الإيمان... فينثره نثر الدقل» (أخرجه الحاكم والبيهقي)." },
                { q: "في أثر جندب بن عبد الله رضي الله عنه، ما معنى كلمة 'حزاورة'؟ ومن أخرجه؟", a: "معناها: جمع الحزور وهو الغلام الذي قارب البلوغ. أخرجه ابن ماجه (٦١)." },
                { q: "ما أجر مجالس تلاوة القرآن ومدارسته في بيوت الله كما ورد في حديث أبي هريرة رضي الله عنه؟", a: "قال ﷺ: «مَا اجْتَمَعَ قَوْمٌ فِي بَيْتٍ مِنْ بُيُوتِ اللَّهِ يَتْلُونَ كِتَابَ اللَّهِ وَيَتَدَارَسُونَهُ بَيْنَهُمْ؛ إِلَّا نَزَلَتْ عَلَيْهِمُ السَّكِينَةُ وَغَشِيَتْهُمُ الرَّحْمَةُ...» (أخرجه مسلم ٢٦٩٩)" },
                { q: "كم عدد الآيات التي كان يقرئها أصحاب النبي ﷺ لمن أراد أن يأخذ العلم والعمل معاً؟", a: "كانوا يأخذون عشر آيات فلا يجاوزونها حتى يعلموا ما فيها من العلم والعمل (عن ابن مسعود والسلمي)." },
                { q: "كم مكث عبد الله بن عمر رضي الله عنهما يتعلم سورة البقرة وحدها؟", a: "مكث ثماني سنين يتعلمها (أخرجه مالك في الموطأ ٥٤٦)." },
                { q: "في حديث حذيفة رضي الله عنه في رفع الأمانة، ما تشبيه أثر قبض الأمانة من القلب؟", a: "قال: «فيظل أثرها مثل الوكت، ثم ينام النومَة فتُقبض الأمانة... فيظل أثرها مثل المَجْل، كجمر دحرجته على رجلك...» (أخرجه البخاري ومسلم)." }
            ],
            3: [
                { q: "ما هو العنوان الدقيق والحرفي للباب الثالث؟", a: "بَابٌ فِي تَعْظِيمِ سُنَّةِ النَّبِيِّ ﷺ وَوُجُوبِ اتِّبَاعِهِ وَالِالْتِزَامِ بِهَدْيِهِ وَالِاقْتِدَاءِ بِسِيرَتِهِ" },
                { q: "ما الآية من سورة الأحزاب التي تجعل النبي ﷺ أسوة حسنة؟", a: "قوله تعالى: ﴿لَقَدْ كَانَ لَكُمْ فِي رَسُولِ اللَّهِ أَسْوَةٌ حَسَنَةٌ لِمَن كَانَ يَرْجُوا اللَّهَ وَالْيَوْمَ الْآخِرَ﴾ [الأحزاب: ٢١]" },
                { q: "اذكر الآية التي شرطت محبة الله سبحانه باتباع النبي ﷺ.", a: "قوله تعالى: ﴿قُلْ إِن كُنتُمْ تُحِبُّونَ اللَّهَ فَاتَّبِعُونِي يُحْبِبْكُمُ اللَّهُ وَيَغْفِرْ لَكُمْ ذُنُوبَكُمْ﴾ [آل عمران: ٣١]" },
                { q: "ما الآية التي حذرت المخالفين لأمر النبي ﷺ من الإصابة بالفتنة أو العذاب الأليم؟", a: "قوله تعالى: ﴿فَلْيَحْذَرِ الَّذِينَ يُخَالِفُونَ عَنْ أَمْرِهِ أَن تُصِيبَهُمْ فِتْنَةٌ أَوْ يُصِيبَهُمْ عَذَابٌ أَلِيمٌ﴾ [النور: ٦٣]" },
                { q: "في حديث أبي هريرة رضي الله عنه، من الذي يدخل الجنة ومن الذي يأبى؟", a: "قال ﷺ: «كُلُّ أُمَّتِي يَدْخُلُونَ الْجَنَّةَ إِلَّا مَنْ أَبَى». قَالُوا: وَمَنْ يَأْبَى؟ قَالَ: «مَنْ أَطَاعَنِي دَخَلَ الْجَنَّةَ، وَمَنْ عَصَانِي فَقَدْ أَبَى» (أخرجه البخاري)." },
                { q: "ما القاعدة النبوية الجامعة في حديث أبيهريرة رضي الله عنه المتعلقة بالنهي والأمر؟", a: "قال ﷺ: «إِذَا نَهَيْتُكُمْ عَنْ شَيْءٍ فَاجْتَنِبُوهُ، وَإِذَا أَمَرْتُكُمْ بِأَمْرٍ فَأْتُوا مِنْهُ مَا اسْتَطَعْتُمْ» (متفق عليه)." },
                { q: "ما قول عبد الله بن مسعود رضي الله عنه في أحسن الحديث وأحسن الهدي؟", a: "قال: «إِنَّ أَحْسَنَ الْحَدِيثِ كِتَابُ اللهِ، وَأَحْسَنَ الْهَدْيِ هَدْيُ مُحَمَّدٍ...» (أخرجه البخاري)." },
                { q: "في مَثل الغيث الكثير في حديث أبي موسى الأشعري، ما هي أنواع الأراضي الثلاثة؟", a: "1. أرض نقيّة قبلت الماء فأنبتت الكلأ. 2. أجادب أمسكت الماء فنفع الله بها الناس. 3. قيعان لا تمسك ماءً ولا تنبت كلأً." },
                { q: "ما لفظ حديث عائشة رضي الله عنها الشهير في رد الأعمال المخالفة للشرع؟", a: "قال ﷺ: «مَنْ عَمِلَ عَمَلًا لَيْسَ عَلَيْهِ أَمْرُنَا فَهُوَ رَدٌّ» (أخرجه البخاري ومسلم)." }
            ],
            4: [
                { q: "ما هو العنوان الدقيق للباب الرابع؟", a: "بَابُ تَعْظِيمِ حُدُودِ اللهِ وَالتَّحْذِيرِ مِنْ مُخَالَفَةِ أَمْرِهِ وَأَمْرِ رَسُولِهِ ﷺ" },
                { q: "ما الآية من سورة الحج التي نصت على أن تعظيم شعائر الله من تقوى القلوب؟", a: "قوله تعالى: ﴿ذَلِكَ وَمَن يُعَظِّمْ شَعَبَرَ اللَّهِ فَإِنَّهَا مِن تَقْوَى الْقُلُوبِ﴾ [الحج: ٣٢]" },
                { q: "في قصة المرأة المخزومية التي سرقت، ماذا قال النبي ﷺ لأسامة بن زيد وماذا قال في خطبته؟", a: "قال: «أَتَشْفَعُ فِي حَدٍّ مِنْ حُدُودِ اللَّهِ؟» وقال: «إنما أهْلَكَ الذين قبلكم... لو أن فاطمة بنت محمد سرقت لقطعت يدها» (متفق عليه)." },
                { q: "ماذا قال أبو بكر الصِّديق رضي الله عنه خَوْفاً من مخالفة أمر النبي ﷺ؟", a: "قال: «إنّي أخشى إن تركت شيئاً من أمره أن أزيغ» (أخرجه البخاري ومسلم)." },
                { q: "في قصة عيينة بن حصن مع عمر بن الخطاب، بماذا خاطب عيينة عمر وما الآية التي سكنت غضبه؟", a: "قال عيينة: «هِيْ يَا ابْنَ الْخَطَّابِ! فَوَاللَّهِ مَا تُعْطِينَا الْجَزْلَ...» فقرأ عليه الحُر بن قيس قوله تعالى: ﴿خُذِ الْعَفْوَ وَأْمُرْ بِالْعُرْفِ...﴾ فسكن غضبه (أخرجه البخاري)." },
                { q: "ما هي قصة معقل بن يسار رضي الله عنه مع أخته وسبب نزول آية العضل؟", a: "طلقها زوجها ثم أراد إرجاعها فرفض معقل غيرته، فلما نزلت ﴿فَلَا تَعْضُلُوهُنَّ﴾ قال: «الآن أفعل يا رسول الله» فزوجها إياه (أخرجه البخاري)." }
            ]
        };

        let currentChapter = 1;
        let currentIndex = 0;

        function startFlashcards() {
            document.getElementById('home-card').style.display = 'none';
            document.getElementById('flashcard-section').style.display = 'flex';
            loadCard();
        }

        function showHome() {
            document.getElementById('home-card').style.display = 'block';
            document.getElementById('flashcard-section').style.display = 'none';
        }

        function changeChapter() {
            currentChapter = document.getElementById('chapterSelect').value;
            currentIndex = 0;
            loadCard();
        }

        function loadCard() {
            const cards = chaptersData[currentChapter];
            const card = cards[currentIndex];
            
            document.getElementById('card-counter').innerText = `السؤال ${currentIndex + 1} من أصل ${cards.length}`;
            document.getElementById('questionText').innerText = card.q;
            document.getElementById('answerText').innerText = card.a;
            document.getElementById('answerText').classList.remove('show');
        }

        function toggleAnswer() {
            const answerElem = document.getElementById('answerText');
            answerElem.classList.toggle('show');
        }

        function nextCard() {
            const cards = chaptersData[currentChapter];
            if (currentIndex < cards.length - 1) {
                currentIndex++;
                loadCard();
            } else {
                currentIndex = 0; // العودة لأول السؤال عند النهاية
                loadCard();
            }
        }

        function prevCard() {
            const cards = chaptersData[currentChapter];
            if (currentIndex > 0) {
                currentIndex--;
                loadCard();
            } else {
                currentIndex = cards.length - 1; // الانتقال لأخر السؤال
                loadCard();
            }
        }
    </script>
</body>
</html>
